<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pi 玻璃样板</title>
  <meta name="description" content="从零制作的独立玻璃材质样板，比较清透、柔雾和实底，不改变当前主题。">
  <link rel="stylesheet" href="./study.css">
  <script type="module" src="./study.js"></script>
</head>
<body>
  <main class="container">
    <header class="masthead"><a href="/dashboard/settings">Pi / 玻璃样板</a><span>独立预览，不改当前主题</span></header>
    <div class="intro"><h1>重新做一块玻璃。</h1><p>不是给白色盒子描边，而是让背景在边缘弯过去。</p></div>
    <div class="controls">
      <fieldset><legend>形态</legend><div class="choices" data-control="component">
        <button type="button" data-value="search" aria-pressed="true">搜索框</button>
        <button type="button" data-value="toolbar" aria-pressed="false">工具条</button>
        <button type="button" data-value="sheet" aria-pressed="false">浮层</button>
      </div></fieldset>
      <fieldset><legend>材质</legend><div class="choices" data-control="material">
        <button type="button" data-value="clear" aria-pressed="true">清透</button>
        <button type="button" data-value="frost" aria-pressed="false">柔雾</button>
        <button type="button" data-value="solid" aria-pressed="false">实底</button>
      </div></fieldset>
      <fieldset><legend>背景</legend><div class="choices" data-control="background">
        <button type="button" data-value="lake" aria-pressed="true">湖景</button>
        <button type="button" data-value="paper" aria-pressed="false">浅底</button>
        <button type="button" data-value="grid" aria-pressed="false">网格</button>
      </div></fieldset>
    </div>
    <section class="scene" data-component="search" data-material="clear" data-background="lake" aria-label="可交互玻璃预览">
      <div class="scene-paint" aria-hidden="true"></div>
      <div class="specimen">
        <div class="glass">
          <div class="optics" aria-hidden="true"><div class="scene-paint"></div></div>
          <div class="tint" aria-hidden="true"></div>
          <div class="glass-content">
            <div class="search specimen-view" data-view="search" role="search" aria-label="演示搜索">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <input type="search" name="preview-query" aria-label="试着输入文字" placeholder="试着输入文字…" autocomplete="off">
              <button type="button" class="search-action" aria-label="预览搜索反馈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
            </div>
            <div class="toolbar specimen-view" data-view="toolbar" hidden>
              <button type="button" data-tool="back" aria-label="移到左侧"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
              <button type="button" data-tool="bookmark" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4Z"/></svg><span>收藏</span></button>
              <button type="button" data-tool="forward" aria-label="移到右侧"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
            </div>
            <section class="sheet specimen-view" data-view="sheet" hidden aria-label="演示浮层">
              <div class="sheet-heading"><h2>一层，就够了。</h2><button type="button" class="close" aria-label="关闭演示浮层"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
              <p>背景留在玻璃里面。文字、图标和操作，留在清晰的那一层。</p>
              <ul><li>薄亮边，不是白色描边框</li><li>连续表面，不嵌套卡片</li><li>背景折射，内容不变形</li></ul>
              <button type="button" class="return">回到搜索框</button>
            </section>
          </div>
        </div>
      </div>
    </section>
    <div class="scene-controls">
      <label class="position">移动玻璃<input type="range" min="0" max="100" value="50" aria-label="玻璃水平位置"></label>
      <label class="refraction"><input type="checkbox" checked>开启折射</label>
      <button type="button" class="reset">恢复初始状态</button>
    </div>
    <p class="feedback" role="status" aria-live="polite">所有控件仅用于演示，不读取或写入你的数据。</p>
    <noscript><p>当前显示静态磨砂样板；交互与折射需要 JavaScript。</p></noscript>
    <footer><span>已知背景的独立渲染样板，不代表整个应用已替换。</span><a href="./README.md">背景照片与实现说明</a></footer>
  </main>
  <svg class="filter-definitions" aria-hidden="true" width="0" height="0" focusable="false"><defs></defs></svg>
</body>
</html>
